name: Build Unity APK (No License Required)

on: [workflow_dispatch]

jobs:
  buildForAndroid:
    name: Cloud Compile Android APK 📱
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Build Memory
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android
          restore-keys: |
            Library-

      - name: Compile C# to Android Game
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE || '<?xml version="1.0" encoding="UTF-8"?><License id="Terms"><LicenseType Value="Personal"/><DeveloperSign Value="True"/></License>' }}
        with:
          targetPlatform: Android

      - name: Prepare Final Download Link
        uses: actions/upload-artifact@v4
        with:
          name: train-game-apk
          path: build/Android/Android.apk
