name: Build Unity APK (Free License Profile)

on: [workflow_dispatch]

jobs:
  buildAndroid:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch project files
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android
          restore-keys: |
            Library-

      - name: Compile Game Code
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: |
            <?xml version="1.0" encoding="UTF-8"?>
            <License id="Terms">
              <LicenseType Value="Personal"/>
              <DeveloperSign Value="True"/>
            </License>
        with:
          projectPath: .
          targetPlatform: Android

      - name: Upload Playable File
        uses: actions/upload-artifact@v4
        with:
          name: derail-valley-mobile-apk
          path: build/Android/Android.apk
